<!DOCTYPE html>
<html lang="en">
<body>
    <header>
        <h1>Recipe Book</h1>
    </header>
    <main>
        <h2>{{ recipe.name }}</h2>
        <h3>Ingredients:</h3>
        <ul>
            {% for ingredient in recipe.ingredients.all %}
                <li>
                    Ingredient: {{ ingredient.ingredient.name }}  
                    Quantity: {{ ingredient.quantity }}</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
