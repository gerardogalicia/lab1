<!DOCTYPE html>
<html lang="en">
<body>
    <header>
        <h1>Recipe Book</h1>
    </header>
    <main>
        {% for recipe in recipes %}
            <li>
                <a href="{% url 'ledger:recipe_detail' recipe.id %}">{{ recipe.name }}</a>
            </li>
        {% endfor %}

        {% if user.is_authenticated %}
            <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Logout</button>
            </form>
        {% endif %}


    </main>
</body>
</html>
